version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apm_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/app.db
      - SECRET_KEY=super-secret-production-key-replace-with-env-min-32-chars
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173","http://127.0.0.1:5173","http://localhost:8000"]
      - WORKER_POLL_INTERVAL_SECONDS=2.0
      - WORKER_LOCK_TIMEOUT_SECONDS=300
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apm_worker
    restart: unless-stopped
    command: python scripts/run_worker.py
    volumes:
      - sqlite_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/app.db
      - SECRET_KEY=super-secret-production-key-replace-with-env-min-32-chars
      - WORKER_POLL_INTERVAL_SECONDS=2.0
      - WORKER_LOCK_TIMEOUT_SECONDS=300
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apm_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  sqlite_data:
    name: apm_sqlite_data
